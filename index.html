<!DOCTYPE html>
<html>
<head>
<title>InfinitySoft</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    padding: 20px;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
}

h1 {
    text-align: center;
    font-size: 38px;
}

.subtitulo {
    text-align: center;
    color: #555;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 15px;
    background: black;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    margin-top: 10px;
}

.box {
    background: #f1f1f1;
    padding: 15px;
    margin-top: 20px;
    border-radius: 12px;
}
</style>

</head>

<body>

<div class="container">

<h1>InfinitySoft</h1>

<p class="subtitulo">
Automação simples de vendas
</p>

<h3>Criar Automação</h3>

<input id="produto" placeholder="Nome do produto">

<input id="palavra" placeholder="Palavra-chave (ex: quero)">

<input id="link" placeholder="Link de compra">

<button onclick="ativar()">
Ativar Automação
</button>


<div class="box">

<h3>Teste da automação</h3>

<input id="teste" placeholder="Digite a palavra-chave">

<button onclick="responder()">
Enviar
</button>

<p id="resultado"></p>

</div>


<div class="box">

Status:
<br>
🟢 Sistema pronto

</div>


</div>


<script>

let produto = "";
let palavra = "";
let link = "";


function ativar(){

produto = document.getElementById("produto").value;
palavra = document.getElementById("palavra").value.toLowerCase();
link = document.getElementById("link").value;


alert("Automação ativada!");

}


function responder(){

let mensagem =
document.getElementById("teste").value.toLowerCase();


if(mensagem == palavra && palavra != ""){

document.getElementById("resultado").innerHTML =
"Olá! Obrigado pelo interesse em " + produto +
"<br><br>Acesse o link de compra:<br>" +
link;

}

else{

document.getElementById("resultado").innerHTML =
"Palavra não reconhecida.";

}

}

</script>


</body>
</html>
