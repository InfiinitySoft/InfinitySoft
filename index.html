<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfinitySoft</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#111827;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container{
  background:#1f2937;
  padding:30px;
  border-radius:15px;
  width:90%;
  max-width:350px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:0;
}
button{
  background:#2563eb;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">
<h1>InfinitySoft</h1>

<h3>Entrar</h3>

<input id="email" type="email" placeholder="Seu e-mail">

<input id="senha" type="password" placeholder="Sua senha">

<button onclick="login()">Entrar</button>

<button onclick="cadastro()">Criar conta</button>

<p id="mensagem"></p>
</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  // COLOQUE A CONFIGURAÇÃO DO FIREBASE AQUI
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


window.cadastro = function(){

let email=document.getElementById("email").value;
let senha=document.getElementById("senha").value;

createUserWithEmailAndPassword(auth,email,senha)
.then(()=>{
document.getElementById("mensagem").innerHTML="Conta criada com sucesso!";
})
.catch(()=>{
document.getElementById("mensagem").innerHTML="Erro ao criar conta";
});

}


window.login = function(){

let email=document.getElementById("email").value;
let senha=document.getElementById("senha").value;

signInWithEmailAndPassword(auth,email,senha)
.then(()=>{
document.getElementById("mensagem").innerHTML="Login realizado!";
})
.catch(()=>{
document.getElementById("mensagem").innerHTML="Dados incorretos";
});

}

</script>

</body>
</html>
