<!DOCTYPE html>
<html>
<head>
<title>InfinitySoft</title>

<style>
    <script>
function ativar(){

alert("Automação ativada com sucesso!");

}
</script>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    text-align: center;
    padding: 30px;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
}

h1 {
    font-size: 38px;
}

p {
    color: #555;
}

input {
    width: 90%;
    padding: 12px;
    margin: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: black;
    color: white;
    padding: 15px;
    width: 95%;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}

.resultado {
    margin-top: 20px;
    background: #eee;
    padding: 15px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div class="container">

<h1>InfinitySoft</h1>

<p>
Automatize suas vendas de forma simples.
</p>

<h3>Criar Automação</h3>

<input placeholder="Nome do produto">

<input placeholder="Palavra-chave (ex: quero)">

<input placeholder="Link do produto">

<button onclick="ativar()">
Ativar Automação
</button>


<div class="resultado">

Automação pronta:
<br><br>

Quando alguém enviar:
<b>quero</b>

<br><br>

Será enviado o link do produto.

</div>

</div>

</html>
